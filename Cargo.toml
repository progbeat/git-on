[package]
name = "git-on"
version = "1.5.3"
edition = "2021"
rust-version = "1.89"
description = "Run commands on immutable Git trees with ignored-only temporary writes"
license = "MIT"
repository = "https://github.com/progbeat/git-on"

[features]
default = []
# Private benchmark instrumentation; normal builds expose no metrics channel.
test-metrics = []

[[example]]
name = "source-probe"
path = "tests/support/source_probe.rs"
required-features = ["test-metrics"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
console = "0.16"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# The two legacy pin callbacks use the public Oid type from git2 0.20.
git2-legacy = { package = "git2", version = "0.20", default-features = false }
libgit2-sys = { version = "0.18", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
lru = { version = "=0.16.3", default-features = false }
gix-glob = "0.29"
gix-quote = "0.6.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1-checked = { version = "=0.10.0", default-features = false }
signal-hook = "0.3"
signal-hook-registry = "1.4"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
curl = { version = "0.4.50", default-features = false }
curl-sys = { version = "0.4", default-features = false }
memchr = "2"
url = "2.5"
blake3 = "1.8.7"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
