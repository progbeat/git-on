[package]
name = "git-on"
version = "1.3.0"
edition = "2021"
rust-version = "1.89"
description = "Run commands on immutable Git trees with ignored-only temporary writes"
license = "MIT"
repository = "https://github.com/progbeat/git-on"

[features]
default = []
# Private benchmark instrumentation; normal builds expose no metrics channel.
test-metrics = []

[[example]]
name = "source-probe"
path = "tests/support/source_probe.rs"
required-features = ["test-metrics"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
gix-glob = "0.29"
gix-quote = "0.6.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }

# Compile the Linux callback adapter in native unit tests, without mounting.
[target.'cfg(target_os = "macos")'.dev-dependencies]
fuser = { version = "=0.18.0", default-features = false, features = ["macos-no-mount"] }
