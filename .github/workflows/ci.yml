name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Exhaustive full-million matrix before release (expensive)
        type: boolean
        required: true
        default: true

concurrency:
  # Superseded PR heads may cancel. Master/manual runs keep unique groups so
  # existing tag/release semantics are unaffected by later pushes.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scale: ${{ steps.plan.outputs.scale }}
      stress: ${{ steps.plan.outputs.stress }}
      lazy: ${{ steps.plan.outputs.lazy }}
      resources: ${{ steps.plan.outputs.resources }}
      profile: ${{ steps.plan.outputs.profile }}
      scale_matrix: ${{ steps.plan.outputs.scale_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 scripts/ci_plan.py build --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --report ci-plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error

  rust:
    needs: [changes]
    timeout-minutes: 20
    outputs:
      resources_step: ${{ steps.pack_scaling.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select stable Rust and quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install native Git and disposable transport fixture dependencies
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes git openssh-server openssl gnupg strace
          git --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 tests/stress.py --self-test
      - run: python3 tests/check_fuse_coverage.py --self-test
      - run: python3 tests/check_fuse_coverage.py
      - run: cargo clippy --locked --all-targets --features test-metrics -- -D warnings
      # This pure native-Git pattern oracle already ran above. Its matcher has
      # no metrics feature branches; keep every feature-sensitive runtime case.
      - run: cargo test --locked --all-targets --features test-metrics -- --skip policy::tests::adversarial_patterns_match_git_byte_for_byte
      - name: Check the locked graph at Rust 1.89 MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets --features test-metrics
          cargo +1.89.0 build --release --locked --bin git-on
      - run: cargo build --locked
      - name: CLI tests without a mount
        run: python3 tests/integration.py --binary target/debug/git-on CliTests
      - name: Explicit-all materialization without a FUSE helper
        run: python3 tests/materialized.py target/debug/git-on
      - name: Installer smoke test
        run: python3 tests/installer_smoke.py --binary target/debug/git-on
      - name: Native Git oracle, real HTTPS/OpenSSH, run-storage and transport regressions
        run: |
          cargo build --locked --features test-metrics --example source-probe --bin git-on
          python3 tests/remote.py
          python3 tests/ssh_regressions.py
          python3 tests/native_job_control.py
      - name: Measure distinct-object pack work
        id: pack_scaling
        if: needs.changes.outputs.resources == 'true'
        # Current regressions run on every PR. Authentic red-before replays are
        # retained as opt-in commands, not rebuilt on every unchanged push.
        run: python3 tests/pack_scaling.py --probe target/debug/examples/source-probe --output pack-scaling.jsonl
      - name: Retain pack metadata measurements
        if: always() && needs.changes.outputs.resources == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: object-scaling
          path: |
            pack-scaling.jsonl
          if-no-files-found: ignore

  real-fuse:
    needs: [changes]
    timeout-minutes: ${{ needs.changes.outputs.profile == 'exhaustive' && 360 || 20 }}
    outputs:
      stress_step: ${{ steps.stress.outcome }}
      passthrough_scale: ${{ steps.passthrough.outputs.scale_coverage }}
    # This job intentionally fails if the runner cannot open /dev/fuse or mount.
    # A skipped/emulated filesystem test is never accepted as FUSE evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install FUSE and pinned uv
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git openssh-server openssl gnupg strace
          python3 -m pip install --user 'uv==0.8.22'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Require a usable FUSE device
        run: |
          test -c /dev/fuse
          command -v fusermount3
          python3 - <<'PY'
          import os
          fd = os.open('/dev/fuse', os.O_RDWR)
          os.close(fd)
          PY
      - name: Record Linux passthrough prerequisites without privilege changes
        run: python3 scripts/passthrough_prerequisites.py
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --release --locked
      - name: Real mount, adversarial operations, process lifecycle, and uv
        run: python3 tests/integration.py --binary target/release/git-on --require-fuse --uv
      - name: All four write policies on real FUSE
        run: python3 tests/write_policy.py --binary target/release/git-on --require-fuse
      - name: Build private resource instrumentation
        run: cargo build --release --locked --features test-metrics --example source-probe --bin git-on
      - name: Separate invocation setup from increasing same-mount demand
        if: needs.changes.outputs.resources == 'true'
        run: |
          python3 tests/startup_profile.py --binary target/release/git-on --output startup-profile.jsonl
          python3 tests/startup_profile.py --binary target/release/git-on --policies ignored,all --sizes 160 --trials 1 --profile-spans --output callback-profile.jsonl
      - name: Remote mounts, native git -c verification, writes and transport faults
        run: |
          python3 tests/remote.py --require-fuse --probe target/release/examples/source-probe --binary target/release/git-on
          python3 tests/ssh_regressions.py --probe target/release/examples/source-probe --binary target/release/git-on
          python3 tests/native_job_control.py --binary target/release/git-on

      - name: Bounded kernel-cache and waited-CPU profile
        if: needs.changes.outputs.resources == 'true'
        run: python3 tests/io_profile.py --binary target/release/git-on --files 1000 --output io-profile.jsonl
      - name: Distinct-object CLI preparation and closed-reader reuse
        if: needs.changes.outputs.resources == 'true'
        run: |
          python3 tests/import_profile.py --binary target/release/git-on --backend fuse --sizes 160 --output import-profile-fuse.jsonl
          python3 tests/import_profile.py --binary target/release/git-on --backend materialized --sizes 32 --trace --output import-profile-materialized.jsonl
      - name: Wide-tree preparation and repeated metadata with full disk baseline
        if: needs.changes.outputs.resources == 'true'
        run: |
          python3 tests/metadata_profile.py --binary target/release/git-on --backend fuse --source local --sizes 1000,100000 --output metadata-profile-local.jsonl
          python3 tests/metadata_profile.py --binary target/release/git-on --backend fuse --source remote --sizes 100000 --output metadata-profile-remote.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.changes.outputs.resources == 'true'
        with:
          name: io-profile
          path: |
            io-profile.jsonl
            import-profile-fuse.jsonl
            import-profile-materialized.jsonl
            metadata-profile-local.jsonl
            metadata-profile-remote.jsonl
            startup-profile.jsonl
            callback-profile.jsonl
          if-no-files-found: error

      - name: Real-FUSE generated-file passthrough fallback
        run: python3 tests/passthrough.py --binary target/release/git-on --expect=fallback

      - name: Per-file fsync callback and error propagation on real FUSE
        run: python3 tests/fsync_contract.py --binary target/release/git-on

      - name: Observe generated-file mmap and mount lifetime on ordinary FUSE
        run: python3 tests/passthrough_lifecycle.py --binary target/release/git-on --expect=fallback

      - name: Actual kernel passthrough with an isolated test-daemon capability
        id: passthrough
        env:
          SCALE_REQUIRED: ${{ needs.changes.outputs.scale }}
          SCALE_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          # Owner-approved test only: never grant a capability to the checkout's
          # binary or run the command as root. Nothing privileged is uploaded.
          command -v setcap
          command -v getcap
          TEST_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/git-on-passthrough.XXXXXXXX")
          TEST_BINARY="$TEST_DIRECTORY/git-on"
          cp target/release/git-on "$TEST_BINARY"
          cleanup_passthrough_test() {
            if test -n "$(getcap "$TEST_BINARY")"; then
              sudo setcap -r "$TEST_BINARY" || return 1
            fi
            test -z "$(getcap "$TEST_BINARY")" || return 1
            rm -rf "$TEST_DIRECTORY"
            test ! -e "$TEST_DIRECTORY" || return 1
            echo 'Test capability removed and private binary copy deleted'
          }
          trap cleanup_passthrough_test EXIT
          sudo setcap cap_sys_admin=ep "$TEST_BINARY"
          getcap "$TEST_BINARY"
          # Both suites assert ordinary child UID and zero Eff/Prm/Amb caps.
          python3 tests/passthrough.py --binary "$TEST_BINARY" --expect=enabled
          python3 tests/passthrough_lifecycle.py --binary "$TEST_BINARY" --expect=enabled
          case "$SCALE_REQUIRED" in
            true)
              for SOURCE in local remote; do
                python3 tests/scalability.py --binary "$TEST_BINARY" --backend passthrough --source "$SOURCE" --policies ignored --profile "$SCALE_PROFILE" --output "stress-artifacts/scale-passthrough-$SOURCE.jsonl"
              done
              echo 'scale_coverage=passed' >> "$GITHUB_OUTPUT"
              ;;
            false) echo 'scale_coverage=not_required' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Missing/invalid scale plan' >&2; exit 1 ;;
          esac

      - name: Seeded bounded filesystem differential stress
        id: stress
        if: needs.changes.outputs.stress == 'true'
        run: >-
          python3 tests/stress.py --binary target/release/git-on --require-fuse
          --seed 0x5eed --seed 0xc0ffee --operations 400 --max-nodes 64
          --max-file-bytes 65536 --timeout 90 --trace-dir stress-artifacts
      - name: Retain reproducible stress traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-stress-traces
          path: stress-artifacts/*.jsonl
          if-no-files-found: ignore

  lazy-performance:
    needs: [changes]
    if: needs.changes.outputs.lazy == 'true'
    # Exact output and demand-count gates; measured timings have no arbitrary SLA.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install FUSE
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git openssl
          test -c /dev/fuse
          command -v fusermount3
      - name: Build optimized runner
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --locked --features test-metrics --example source-probe --bin git-on
      - name: Remote million distinct-file fresh-run fetch gates through real FUSE
        run: >-
          python3 tests/remote.py --require-fuse --million
          --probe target/release/examples/source-probe --binary target/release/git-on
          RemoteTests.test_million_distinct_file_remote_fresh_runs_bounded_fetch --evidence-output million-remote.json
      - name: Check benchmark harness
        run: python3 tests/benchmark.py self-test
      - name: Prepare the million-file fixture outside timed runs
        run: python3 tests/benchmark.py prepare --directory /tmp/git-on-million --digit-files 1000000
      - name: Measure seeded random reads through a real mount
        run: >-
          python3 tests/benchmark.py run
          --fixtures /tmp/git-on-million
          --output benchmark-results
          --binary target/release/git-on
          --repeats 3 --warmups 0 --timeout 180 --seed 0
      - name: Compare a smaller distinct-file tree
        run: |
          python3 tests/benchmark.py prepare --directory /tmp/git-on-small --digit-files 1000
          python3 tests/benchmark.py run --fixtures /tmp/git-on-small --output benchmark-small --binary target/release/git-on --repeats 3 --warmups 0 --timeout 180 --seed 0
      - name: Measure untouched subtree scaling, repeated access, and large ranges
        run: |
          python3 tests/benchmark.py prepare --directory /tmp/git-on-secondary --suites scale large --sizes 0,1000,1000000 --large-mib 1,16,64
          python3 tests/benchmark.py run --fixtures /tmp/git-on-secondary --output benchmark-secondary --binary target/release/git-on --suites scale repeat large --repeats 3 --warmups 0 --repeat-count 1000 --timeout 180 --seed 0
      - name: Print measurements including failed trials
        if: always()
        run: |
          for directory in benchmark-results benchmark-small benchmark-secondary; do
            if test -f "$directory/results.jsonl"; then cat "$directory/results.jsonl"; fi
          done

      - name: Retain lazy-access evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lazy-performance
          path: |
            million-remote.json
            benchmark-results/results.jsonl
            benchmark-small/results.jsonl
            benchmark-secondary/results.jsonl
          if-no-files-found: error

  repository-scale:
    needs: [changes]
    if: needs.changes.outputs.scale == 'true'
    # Selection is conservative; the aggregate checks every expected report.
    timeout-minutes: ${{ needs.changes.outputs.profile == 'exhaustive' && 360 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.scale_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git openssl
      - run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked --features test-metrics --bin git-on
      - name: Source, policy and signature behavior matrix
        env:
          SOURCES: ${{ matrix.sources }}
          BACKEND: ${{ matrix.backend }}
          POLICIES: ${{ matrix.policies }}
          PROFILE: ${{ matrix.profile }}
        run: |
          for SOURCE in ${SOURCES//,/ }; do
            python3 tests/scalability.py --binary target/release/git-on --backend "$BACKEND" --source "$SOURCE" --policies "$POLICIES" --profile "$PROFILE" --output "scale-results-$SOURCE.jsonl"
          done
      - name: Retain scenario plans and phase measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale-${{ matrix.runner }}-${{ matrix.backend }}-${{ matrix.sources }}-${{ matrix.profile }}
          path: scale-results-*.jsonl
          if-no-files-found: ignore

  webkit-scale:
    needs: [changes]
    if: needs.changes.outputs.scale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native Git and require real FUSE
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git
          test -c /dev/fuse
          command -v fusermount3
      - name: Build optimized instrumented runner
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked --features test-metrics --bin git-on
      - name: Acquire and verify the pinned source once
        run: python3 tests/real_repository.py prepare --directory "$RUNNER_TEMP/webkit-fixture"
      - name: Full real snapshot and useful tooling command with complete baselines
        run: python3 tests/real_repository.py run --fixture "$RUNNER_TEMP/webkit-fixture" --binary target/release/git-on --profile-full --output webkit-results.jsonl
      - name: Retain real repository evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webkit-scale
          path: webkit-results.jsonl
          if-no-files-found: error

  release-policy:
    runs-on: ubuntu-24.04
    outputs:
      release_required: ${{ steps.policy.outputs.release_required }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test version policy
        run: |
          python3 tests/test_release_policy.py
          python3 tests/test_installer.py
          python3 tests/test_third_party_notices.py
          python3 tests/test_write_policy_harness.py
          python3 tests/test_passthrough_lifecycle_harness.py
          python3 tests/test_ci_contract.py
          python3 tests/test_scalability_harness.py
          python3 tests/test_ci_plan.py
          python3 tests/test_record_demo.py
          python3 tests/test_io_profile.py
          python3 tests/test_import_profile.py
          python3 tests/test_metadata_profile.py
          python3 tests/test_real_repository.py
      - name: Test lossless conversion and output preservation
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv
          python3 -m venv /tmp/git-on-conversion-tests
          /tmp/git-on-conversion-tests/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/git-on-conversion-tests/bin/python tests/test_convert_demo.py
      - name: Validate against current master or the pre-push master SHA
        id: policy
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = workflow_dispatch ]; then
            # Fetch through the authenticated checkout helper without persisting credentials.
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags origin "$BASE"
            git merge-base --is-ancestor "$BASE" HEAD || { echo 'Update this PR from current master, then recalculate its version.'; exit 1; }
            python3 scripts/release_policy.py --base "$BASE"
          else
            # Full checkout history includes the push's old master for squash,
            # merge commits and rebased multi-commit PRs alike.
            python3 scripts/release_policy.py --push-event "$GITHUB_EVENT_PATH"
          fi

  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features test-metrics -- -D warnings
      - run: cargo test --locked --all-targets --features test-metrics
      - run: cargo build --locked
      - run: python3 tests/integration.py --binary target/debug/git-on CliTests
      - run: python3 tests/materialized.py target/debug/git-on
      - run: python3 tests/test_installer.py
      # macOS 1.3.0 supports CLI/materialization; mounts are deferred to #12.

  package-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
      - name: Build and exercise the native package
        run: |
          cargo fetch --locked --target=${{ matrix.target }}
          python3 scripts/third_party_notices.py --target=${{ matrix.target }}
          dist build --artifacts=all --target=${{ matrix.target }}
          mkdir unpacked
          tar -xzf target/distrib/git-on-${{ matrix.target }}.tar.gz -C unpacked
          VERSION=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$(unpacked/git-on-${{ matrix.target }}/git-on --version)" = "git-on $VERSION"
          cmp LICENSE unpacked/git-on-${{ matrix.target }}/LICENSE
          cmp THIRD_PARTY_NOTICES unpacked/git-on-${{ matrix.target }}/THIRD_PARTY_NOTICES
          python3 tests/dist_installer.py target/distrib
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          python3 tests/integration.py --binary unpacked/git-on-${{ matrix.target }}/git-on --require-fuse
      - if: runner.os == 'macOS'
        run: |
          python3 tests/integration.py --binary unpacked/git-on-${{ matrix.target }}/git-on CliTests
          python3 tests/materialized.py unpacked/git-on-${{ matrix.target }}/git-on

  package:
    # Keep this existing required check present even when optional jobs skip.
    if: always()
    needs: [changes, rust, real-fuse, lazy-performance, repository-scale, webkit-scale, release-policy, macos, package-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.result == 'success'
        with:
          name: ci-plan
          path: gate-data/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.scale == 'true'
        with:
          pattern: scale-*
          path: gate-data/scale
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.scale == 'true'
        with:
          name: webkit-scale
          path: gate-data/webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.scale == 'true' || needs.changes.outputs.stress == 'true'
        with:
          name: filesystem-stress-traces
          path: gate-data/runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.resources == 'true'
        with:
          name: object-scaling
          path: gate-data/resources
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.resources == 'true'
        with:
          name: io-profile
          path: gate-data/imports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.lazy == 'true'
        with:
          name: lazy-performance
          path: gate-data/lazy
      - name: Enforce job outcomes and complete required coverage
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_plan.py check --plan gate-data/plan/ci-plan.json --head "$EXPECTED_HEAD" --evidence gate-data

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-policy.outputs.release_required == 'true'
    needs: [rust, macos, real-fuse, lazy-performance, repository-scale, release-policy, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-policy.outputs.version }}
    steps:
      - name: Start the standard release for this tested version
        shell: bash
        run: |
          tag="v$VERSION"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            test "$existing" = "$GITHUB_SHA" || { echo 'Version tag differs from the tested commit' >&2; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$tag" -f "tag=$tag"
