name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select stable Rust and quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install native Git and disposable transport fixture dependencies
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes git openssh-server openssl gnupg
          git --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 tests/stress.py --self-test
      - run: python3 tests/check_fuse_coverage.py --self-test
      - run: python3 tests/check_fuse_coverage.py
      - run: cargo clippy --locked --all-targets --features test-metrics -- -D warnings
      - run: cargo test --locked --all-targets --features test-metrics
      - name: Check the locked graph at Rust 1.89 MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets --features test-metrics
          cargo +1.89.0 build --release --locked --bin git-on
      - run: cargo build --locked
      - name: CLI tests without a mount
        run: python3 tests/integration.py --binary target/debug/git-on CliTests
      - name: Explicit-all materialization without a FUSE helper
        run: python3 tests/materialized.py target/debug/git-on
      - name: Installer smoke test
        run: python3 tests/installer_smoke.py --binary target/debug/git-on
      - name: Native Git oracle, real HTTPS/OpenSSH, cache and transport regressions
        run: |
          cargo build --locked --features test-metrics --example source-probe --bin git-on
          python3 tests/remote.py
          python3 tests/ssh_regressions.py
          python3 tests/native_job_control.py

  real-fuse:
    # This job intentionally fails if the runner cannot open /dev/fuse or mount.
    # A skipped/emulated filesystem test is never accepted as FUSE evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install FUSE and pinned uv
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git openssh-server openssl gnupg
          python3 -m pip install --user 'uv==0.8.22'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Require a usable FUSE device
        run: |
          test -c /dev/fuse
          command -v fusermount3
          python3 - <<'PY'
          import os
          fd = os.open('/dev/fuse', os.O_RDWR)
          os.close(fd)
          PY
      - name: Record Linux passthrough prerequisites without privilege changes
        run: python3 scripts/passthrough_prerequisites.py
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --release --locked
      - name: Real mount, adversarial operations, process lifecycle, and uv
        run: python3 tests/integration.py --binary target/release/git-on --require-fuse --uv
      - name: All four write policies on real FUSE
        run: python3 tests/write_policy.py --binary target/release/git-on --require-fuse
      - name: Remote mounts, native git -c verification, writes and transport faults
        run: |
          BEFORE=92377e27e32ac424d688ae8bcf0fbe6be0081c0c
          BEFORE_ARGUMENT=()
          # Historical worktrees must never overwrite the reviewed binaries.
          # Cargo can consider HEAD fresh after another worktree writes the
          # same top-level executable in a shared target directory.
          BEFORE_TARGET=/tmp/git-on-historical-target
          # Replay the authentic pre-fix feature revision while reviewing this
          # branch. Later squash merges retain the permanent green tests even
          # when that intermediate commit is no longer in master's ancestry.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then
            git worktree add --detach /tmp/git-on-review-before "$BEFORE"
            cargo build --release --locked --manifest-path /tmp/git-on-review-before/Cargo.toml --target-dir "$BEFORE_TARGET"
            cp "$BEFORE_TARGET/release/git-on" /tmp/git-on-review-before-bin
            BEFORE_ARGUMENT=(--before-binary /tmp/git-on-review-before-bin)
          fi
          LIFECYCLE_BEFORE=8d6c02ede7a6f5d377e2c47c5b2177ee46a477eb
          if git cat-file -e "$LIFECYCLE_BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$LIFECYCLE_BEFORE" HEAD; then
            git worktree add --detach /tmp/git-on-lifecycle-before "$LIFECYCLE_BEFORE"
            cargo build --release --locked --manifest-path /tmp/git-on-lifecycle-before/Cargo.toml --target-dir "$BEFORE_TARGET"
            cp "$BEFORE_TARGET/release/git-on" /tmp/git-on-lifecycle-before-bin
            BEFORE_ARGUMENT+=(--before-lifecycle-binary /tmp/git-on-lifecycle-before-bin)
          fi
          REVIEW_BEFORE=e42774399dba61d02c80235ef54bf61c3abd9e63
          SSH_BEFORE_ARGUMENT=()
          JOB_BEFORE_ARGUMENT=()
          if git cat-file -e "$REVIEW_BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$REVIEW_BEFORE" HEAD; then
            git worktree add --detach /tmp/git-on-review-e427 "$REVIEW_BEFORE"
            cargo build --release --locked --features test-metrics --example source-probe --bin git-on --manifest-path /tmp/git-on-review-e427/Cargo.toml --target-dir "$BEFORE_TARGET"
            cp "$BEFORE_TARGET/release/git-on" /tmp/git-on-review-e427-bin
            cp "$BEFORE_TARGET/release/examples/source-probe" /tmp/git-on-review-e427-probe
            BEFORE_ARGUMENT+=(--before-policy-binary /tmp/git-on-review-e427-bin)
            SSH_BEFORE_ARGUMENT=(--before-boundary-probe /tmp/git-on-review-e427-probe)
            JOB_BEFORE_ARGUMENT=(--before-binary /tmp/git-on-review-e427-bin)
          fi
          CLIENT_BEFORE=87a11d5bbc85b9b8b46a55d054a0e1a6538d5203
          if git cat-file -e "$CLIENT_BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$CLIENT_BEFORE" HEAD; then
            git worktree add --detach /tmp/git-on-client-before "$CLIENT_BEFORE"
            cargo build --release --locked --features test-metrics --example source-probe --bin git-on --manifest-path /tmp/git-on-client-before/Cargo.toml --target-dir "$BEFORE_TARGET"
            cp "$BEFORE_TARGET/release/git-on" /tmp/git-on-client-before-bin
            cp "$BEFORE_TARGET/release/examples/source-probe" /tmp/git-on-client-before-probe
            SSH_BEFORE_ARGUMENT+=(--before-client-binary /tmp/git-on-client-before-bin --before-client-probe /tmp/git-on-client-before-probe)
          fi
          cargo build --release --locked --features test-metrics --example source-probe --bin git-on
          python3 tests/remote.py --require-fuse --probe target/release/examples/source-probe --binary target/release/git-on "${BEFORE_ARGUMENT[@]}"
          python3 tests/ssh_regressions.py --probe target/release/examples/source-probe --binary target/release/git-on "${SSH_BEFORE_ARGUMENT[@]}"
          python3 tests/native_job_control.py --binary target/release/git-on "${JOB_BEFORE_ARGUMENT[@]}"

      - name: Real-FUSE generated-file passthrough fallback
        run: python3 tests/passthrough.py --binary target/release/git-on --expect=fallback

      - name: Per-file fsync callback and error propagation on real FUSE
        run: python3 tests/fsync_contract.py --binary target/release/git-on

      - name: Observe generated-file mmap and mount lifetime on ordinary FUSE
        run: python3 tests/passthrough_lifecycle.py --binary target/release/git-on --expect=fallback

      - name: Actual kernel passthrough with an isolated test-daemon capability
        run: |
          # Owner-approved test only: never grant a capability to the checkout's
          # binary or run the command as root. Nothing privileged is uploaded.
          command -v setcap
          command -v getcap
          TEST_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/git-on-passthrough.XXXXXXXX")
          TEST_BINARY="$TEST_DIRECTORY/git-on"
          cp target/release/git-on "$TEST_BINARY"
          cleanup_passthrough_test() {
            if test -n "$(getcap "$TEST_BINARY")"; then
              sudo setcap -r "$TEST_BINARY" || return 1
            fi
            test -z "$(getcap "$TEST_BINARY")" || return 1
            rm -rf "$TEST_DIRECTORY"
            test ! -e "$TEST_DIRECTORY" || return 1
            echo 'Test capability removed and private binary copy deleted'
          }
          trap cleanup_passthrough_test EXIT
          sudo setcap cap_sys_admin=ep "$TEST_BINARY"
          getcap "$TEST_BINARY"
          # Both suites assert ordinary child UID and zero Eff/Prm/Amb caps.
          python3 tests/passthrough.py --binary "$TEST_BINARY" --expect=enabled
          python3 tests/passthrough_lifecycle.py --binary "$TEST_BINARY" --expect=enabled

      - name: Seeded bounded filesystem differential stress
        run: >-
          python3 tests/stress.py --binary target/release/git-on --require-fuse
          --seed 0x5eed --seed 0xc0ffee --operations 400 --max-nodes 64
          --max-file-bytes 65536 --timeout 90 --trace-dir stress-artifacts
      - name: Retain reproducible stress traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-stress-traces
          path: stress-artifacts/*.jsonl
          if-no-files-found: ignore

  lazy-performance:
    # Exact output and demand-count gates; measured timings have no arbitrary SLA.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install FUSE
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes fuse3 git openssl
          test -c /dev/fuse
          command -v fusermount3
      - name: Build optimized runner
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --locked --features test-metrics --example source-probe --bin git-on
      - name: Remote million distinct-file cold and warm fetch gates through real FUSE
        run: >-
          python3 tests/remote.py --require-fuse --million
          --probe target/release/examples/source-probe --binary target/release/git-on
          RemoteTests.test_million_distinct_file_remote_cold_and_warm_bounded_fetch
      - name: Check benchmark harness
        run: python3 tests/benchmark.py self-test
      - name: Prepare the million-file fixture outside timed runs
        run: python3 tests/benchmark.py prepare --directory /tmp/git-on-million --digit-files 1000000
      - name: Measure seeded random reads through a real mount
        run: >-
          python3 tests/benchmark.py run
          --fixtures /tmp/git-on-million
          --output benchmark-results
          --binary target/release/git-on
          --repeats 3 --warmups 0 --timeout 180 --seed 0
      - name: Compare a smaller distinct-file tree
        run: |
          python3 tests/benchmark.py prepare --directory /tmp/git-on-small --digit-files 1000
          python3 tests/benchmark.py run --fixtures /tmp/git-on-small --output benchmark-small --binary target/release/git-on --repeats 3 --warmups 0 --timeout 180 --seed 0
      - name: Measure untouched subtree scaling, repeated access, and large ranges
        run: |
          python3 tests/benchmark.py prepare --directory /tmp/git-on-secondary --suites scale large --sizes 0,1000,1000000 --large-mib 1,16,64
          python3 tests/benchmark.py run --fixtures /tmp/git-on-secondary --output benchmark-secondary --binary target/release/git-on --suites scale repeat large --repeats 3 --warmups 0 --repeat-count 1000 --timeout 180 --seed 0
      - name: Print measurements including failed trials
        if: always()
        run: |
          for directory in benchmark-results benchmark-small benchmark-secondary; do
            if test -f "$directory/results.jsonl"; then cat "$directory/results.jsonl"; fi
          done

  release-policy:
    runs-on: ubuntu-24.04
    outputs:
      release_required: ${{ steps.policy.outputs.release_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test version policy
        run: |
          python3 tests/test_release_policy.py
          python3 tests/test_publish_release.py
          python3 tests/test_installer.py
          python3 tests/test_dist_integrity.py
          python3 tests/test_third_party_notices.py
          python3 tests/test_write_policy_harness.py
          python3 tests/test_passthrough_lifecycle_harness.py
          python3 tests/test_ci_contract.py
          python3 tests/test_record_demo.py
      - name: Test lossless conversion and output preservation
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv
          python3 -m venv /tmp/git-on-conversion-tests
          /tmp/git-on-conversion-tests/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/git-on-conversion-tests/bin/python tests/test_convert_demo.py
      - name: Validate against current master or the pre-push master SHA
        id: policy
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Fetch through the authenticated checkout helper without persisting credentials.
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags origin "$BASE"
            git merge-base --is-ancestor "$BASE" HEAD || { echo 'Update this PR from current master, then recalculate its version.'; exit 1; }
            python3 scripts/release_policy.py --base "$BASE"
          else
            # Full checkout history includes the push's old master for squash,
            # merge commits and rebased multi-commit PRs alike.
            python3 scripts/release_policy.py --push-event "$GITHUB_EVENT_PATH"
          fi

  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features test-metrics -- -D warnings
      - run: cargo test --locked --all-targets --features test-metrics
      - run: cargo build --locked
      - run: python3 tests/integration.py --binary target/debug/git-on CliTests
      - run: python3 tests/materialized.py target/debug/git-on
      - run: python3 tests/test_installer.py
      # macOS 1.3.0 supports CLI/materialization; mounts are deferred to #12.

  package-build:
    needs: [release-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Fetch reviewed cargo-dist
        run: |
          sh scripts/fetch_dist.sh "$RUNNER_TEMP/dist-tool"
          echo "$RUNNER_TEMP/dist-tool" >> "$GITHUB_PATH"
      - name: Build the native distribution
        run: |
          rustup default 1.90.0
          cargo fetch --locked --target=${{ matrix.target }}
          python3 scripts/third_party_notices.py --target=${{ matrix.target }}
          dist build --artifacts=local --target=${{ matrix.target }} --allow-dirty --output-format=json > local-dist-manifest.json
          cp local-dist-manifest.json target/distrib/${{ matrix.target }}-dist-manifest.json
          python3 - <<'PYPROVENANCE'
          import json, subprocess
          from pathlib import Path
          target='${{ matrix.target }}'
          Path('target/distrib/provenance-'+target+'.json').write_text(json.dumps({'target':target,'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'rust':'1.90.0'})+'\n')
          PYPROVENANCE
      - name: Verify native archive and binary
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('target/distrib')
          for path in root.glob('*.tar.gz'):
              expected=(root/(path.name+'.sha256')).read_text().split()[0]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected
          PY
          mkdir unpacked
          tar -xzf target/distrib/git-on-${{ matrix.target }}.tar.gz -C unpacked
          VERSION=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$(unpacked/git-on-${{ matrix.target }}/git-on --version)" = "git-on $VERSION"
          cmp LICENSE unpacked/git-on-${{ matrix.target }}/LICENSE
          cmp THIRD_PARTY_NOTICES unpacked/git-on-${{ matrix.target }}/THIRD_PARTY_NOTICES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-dist-${{ matrix.target }}-${{ github.sha }}
          path: target/distrib/
          if-no-files-found: error
          retention-days: 7

  package-assemble:
    needs: [package-build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: local-dist-*-${{ github.sha }}
          path: target/distrib
          merge-multiple: true
      - run: sh scripts/fetch_dist.sh "$RUNNER_TEMP/dist-tool"
      - name: Generate and harden the shared release installer
        run: |
          python3 scripts/verify_local_dist.py
          python3 - <<'PYNOTICES'
          import tarfile
          from pathlib import Path
          with tarfile.open('target/distrib/git-on-x86_64-unknown-linux-gnu.tar.gz') as archive:
              member=archive.getmember('git-on-x86_64-unknown-linux-gnu/THIRD_PARTY_NOTICES')
              assert member.isfile() and 0<member.size<10*1024*1024
              Path('THIRD_PARTY_NOTICES').write_bytes(archive.extractfile(member).read())
          PYNOTICES
          "$RUNNER_TEMP/dist-tool/dist" build --artifacts=global --allow-dirty --output-format=json > global-dist-manifest.json
          python3 scripts/harden_dist_installer.py target/distrib
          python3 scripts/assemble_dist.py
          python3 scripts/verify_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package-install:
    needs: [package-assemble]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: dist
      - run: python3 scripts/verify_dist.py dist
      - run: python3 tests/dist_installer.py --dist dist --install-dir "$RUNNER_TEMP/installed"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          python3 tests/integration.py --binary "$RUNNER_TEMP/installed/git-on" --require-fuse
      - if: runner.os == 'macOS'
        name: Full generated installer with stock macOS shasum only
        run: python3 tests/dist_installer.py --dist dist --install-dir "$RUNNER_TEMP/installed" --without-gnu-hash
      - if: runner.os == 'macOS'
        run: python3 tests/materialized.py "$RUNNER_TEMP/installed/git-on"

  package:
    if: always()
    needs: [package-install]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.package-install.result }}' = success

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-policy.outputs.release_required == 'true'
    needs: [rust, macos, real-fuse, lazy-performance, release-policy, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Verify and publish this tested version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUIRED: ${{ needs.release-policy.outputs.release_required }}
        run: |
          python3 scripts/release_policy.py --push-event "$GITHUB_EVENT_PATH"
          python3 scripts/verify_dist.py dist
          python3 scripts/publish_release.py
